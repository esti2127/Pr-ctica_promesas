<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  
  <title>Galería de imágenes</title>
</head>

<body>
  <form id="formulario" method="POST">
    <p>
      <label for="id">ID</label>
      <input type="number" id="id" name="id" required >
    </p>
    <p>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" disabled>
    </p>
    <p>
      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="Apellido" disabled>
    </p>
    <p>
      <label for="Edad">Edad</label>
      <input type="number" id="edad" name="Edad" disabled>
    </p>
    <p>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@dominio.com" disabled>
    </p>
    <button type="submit">Buscar usuario</button>
  </form>
  <script src="js/main.js"></script>

</body>

</html>
